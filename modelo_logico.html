<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienestar en Casa — Modelo lógico</title>
<style>
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #fff; color: #1e293b; }
  header { padding: 18px 28px 6px; display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.35rem; }
  .sub { color: #475569; font-size: .85rem; margin-top: 2px; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: .8rem; align-items: center; }
  .leyenda span.c { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  button { font: inherit; font-size: .8rem; padding: 6px 12px; border: 1px solid #94a3b8; background: #fff; border-radius: 8px; cursor: pointer; }
  #lienzo { padding: 8px 20px 24px; overflow-x: auto; }
  svg text { font-family: "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Bienestar en Casa — Modelo lógico relacional</h1>
    <div class="sub">Bases de Datos Multimedia · Entrega 1 · MySQL 8 · 14 tablas</div>
  </div>
  <div class="leyenda">
    <span><span class="c" style="background:#2563eb"></span>Usuarios y acceso</span>
    <span><span class="c" style="background:#d97706"></span>Disponibilidad y cobertura</span>
    <span><span class="c" style="background:#059669"></span>Catálogo de servicios</span>
    <span><span class="c" style="background:#7c3aed"></span>Solicitudes y reservas</span>
    <span><b style="color:#b45309">PK</b> primaria · <b style="color:#2563eb">FK</b> foránea · <b style="color:#be123c">UK</b> única</span>
    <button id="png">Descargar PNG</button>
  </div>
</header>
<div id="lienzo"></div>

<script>
const NS = "http://www.w3.org/2000/svg";
const ROW = 22, HEAD = 30;

const GRUPOS = {
  usuarios: { titulo: "Usuarios y acceso",        base: "#2563eb", fondo: "#eff6ff" },
  disp:     { titulo: "Disponibilidad y cobertura", base: "#d97706", fondo: "#fffbeb" },
  catalogo: { titulo: "Catálogo de servicios",    base: "#059669", fondo: "#ecfdf5" },
  reservas: { titulo: "Solicitudes y reservas",   base: "#7c3aed", fondo: "#f5f3ff" },
};

// c: [nombre, tipo, llave]  (llave: PK, FK, PK/FK, UK)
const E = {
  usuario: { g:"usuarios", x:520, y:90, w:250, c:[
    ["id_usuario","INT","PK"],["correo","VARCHAR(150)","UK"],["contrasena_hash","VARCHAR(255)",""],
    ["nombres","VARCHAR(80)",""],["apellidos","VARCHAR(80)",""],["telefono","VARCHAR(20)",""],
    ["tipo_usuario","ENUM",""],["fecha_registro","DATETIME",""]] },
  recuperacion_contrasena: { g:"usuarios", x:840, y:90, w:250, c:[
    ["id_recuperacion","INT","PK"],["id_usuario","INT","FK"],["tipo","ENUM",""],["token_hash","VARCHAR(255)",""],
    ["fecha_creacion","DATETIME",""],["fecha_expiracion","DATETIME",""],["fecha_uso","DATETIME",""],["invalidado","TINYINT",""]] },
  direccion_cliente: { g:"usuarios", x:40, y:360, w:250, c:[
    ["id_direccion","INT","PK"],["id_cliente","INT","FK"],["ciudad","VARCHAR(80)",""],["barrio_sector","VARCHAR(100)",""],
    ["direccion","VARCHAR(200)",""],["info_complementaria","VARCHAR(255)",""],["es_principal","TINYINT",""]] },
  cliente: { g:"usuarios", x:330, y:360, w:220, c:[["id_usuario","INT","PK/FK"]] },
  proveedor: { g:"usuarios", x:840, y:360, w:250, c:[
    ["id_usuario","INT","PK/FK"],["nombre_profesional","VARCHAR(120)",""],["descripcion_perfil","TEXT",""],["experiencia_anios","TINYINT",""]] },

  zona_atencion: { g:"disp", x:1160, y:110, w:240, c:[
    ["id_zona","INT","PK"],["id_proveedor","INT","FK"],["ciudad","VARCHAR(80)",""],["barrio_sector","VARCHAR(100)",""]] },
  horario_disponibilidad: { g:"disp", x:1160, y:260, w:240, c:[
    ["id_horario","INT","PK"],["id_proveedor","INT","FK"],["dia_semana","TINYINT",""],["hora_inicio","TIME",""],["hora_fin","TIME",""]] },
  periodo_no_disponible: { g:"disp", x:1160, y:430, w:240, c:[
    ["id_periodo","INT","PK"],["id_proveedor","INT","FK"],["fecha_inicio","DATETIME",""],["fecha_fin","DATETIME",""],["motivo","VARCHAR(200)",""]] },

  servicio: { g:"catalogo", x:840, y:640, w:250, c:[
    ["id_servicio","INT","PK"],["id_proveedor","INT","FK"],["id_categoria","INT","FK"],["nombre","VARCHAR(120)",""],
    ["descripcion","TEXT",""],["duracion_min","SMALLINT",""],["precio","DECIMAL(10,2)",""],["estado","ENUM",""]] },
  categoria_servicio: { g:"catalogo", x:1160, y:760, w:240, c:[["id_categoria","INT","PK"],["nombre","VARCHAR(80)","UK"]] },
  recurso_multimedia: { g:"catalogo", x:1160, y:870, w:240, c:[
    ["id_recurso","INT","PK"],["id_servicio","INT","FK"],["tipo","ENUM",""],["url","VARCHAR(500)",""],["descripcion","VARCHAR(200)",""]] },
  servicio_insumo: { g:"catalogo", x:840, y:900, w:250, c:[["id_servicio","INT","PK/FK"],["id_insumo","INT","PK/FK"]] },
  insumo: { g:"catalogo", x:1160, y:1050, w:240, c:[["id_insumo","INT","PK"],["nombre","VARCHAR(120)",""],["tipo","ENUM",""]] },

  solicitud_reserva: { g:"reservas", x:330, y:640, w:290, c:[
    ["id_solicitud","INT","PK"],["id_cliente","INT","FK"],["id_servicio","INT","FK"],["id_direccion","INT","FK"],
    ["nombre_servicio","VARCHAR(120)",""],["precio_servicio","DECIMAL(10,2)",""],["duracion_min","SMALLINT",""],
    ["fecha_hora_inicio","DATETIME",""],["fecha_hora_propuesta","DATETIME",""],["fecha_hora_fin","DATETIME (gen.)",""],
    ["ciudad","VARCHAR(80)",""],["direccion","VARCHAR(200)",""],["barrio_sector","VARCHAR(100)",""],
    ["info_complementaria","VARCHAR(255)",""],["observaciones","VARCHAR(500)",""],["estado","ENUM",""],
    ["motivo","VARCHAR(300)",""],["fecha_creacion","DATETIME",""],["fecha_actualizacion","DATETIME",""]] },
};

// [padre, hijo, cardinalidad del lado hijo, etiqueta]
const R = [
  ["usuario","cliente","0..1","es un"],
  ["usuario","proveedor","0..1","es un"],
  ["usuario","recuperacion_contrasena","N","solicita"],
  ["cliente","direccion_cliente","N","registra"],
  ["cliente","solicitud_reserva","N","crea"],
  ["direccion_cliente","solicitud_reserva","N","se usa en"],
  ["proveedor","zona_atencion","N","atiende en"],
  ["proveedor","horario_disponibilidad","N","define"],
  ["proveedor","periodo_no_disponible","N","registra"],
  ["proveedor","servicio","N","ofrece"],
  ["categoria_servicio","servicio","N","clasifica"],
  ["servicio","recurso_multimedia","N","muestra"],
  ["servicio","servicio_insumo","N","usa"],
  ["insumo","servicio_insumo","N","se usa en"],
  ["servicio","solicitud_reserva","N","es solicitado en"],
];

const el = (n, a = {}, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; };
for (const k in E) E[k].h = HEAD + E[k].c.length * ROW;

const maxX = Math.max(...Object.values(E).map(e => e.x + e.w)) + 40;
const maxY = Math.max(...Object.values(E).map(e => e.y + e.h)) + 40;
const svg = el("svg", { xmlns: NS, width: maxX, height: maxY, viewBox: `0 0 ${maxX} ${maxY}` });
svg.appendChild(el("rect", { width: maxX, height: maxY, fill: "#ffffff" }));

// zonas
const gz = el("g"); svg.appendChild(gz);
for (const gk in GRUPOS) {
  const ms = Object.values(E).filter(e => e.g === gk);
  const x0 = Math.min(...ms.map(e => e.x)) - 18, y0 = Math.min(...ms.map(e => e.y)) - 46;
  const x1 = Math.max(...ms.map(e => e.x + e.w)) + 18, y1 = Math.max(...ms.map(e => e.y + e.h)) + 18;
  const G = GRUPOS[gk];
  gz.appendChild(el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 18, fill: G.fondo, stroke: G.base, "stroke-width": 1.5, "stroke-dasharray": "6 5" }));
  gz.appendChild(el("text", { x: x0 + 16, y: y0 + 26, "font-size": 15, "font-weight": 700, fill: G.base }, G.titulo.toUpperCase()));
}

// relaciones
const ge = el("g"); svg.appendChild(ge);
function ancla(a, b) {
  const ca = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, cb = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  const dx = cb.x - ca.x, dy = cb.y - ca.y;
  const horiz = Math.abs(dx) * 0.55 > Math.abs(dy);
  if (horiz) {
    const sa = dx > 0 ? a.x + a.w : a.x, sb = dx > 0 ? b.x : b.x + b.w;
    const ya = Math.max(a.y + 20, Math.min(a.y + a.h - 20, cb.y)), yb = Math.max(b.y + 20, Math.min(b.y + b.h - 20, ca.y));
    return { p: [sa, ya], q: [sb, yb], dir: "h", sx: Math.sign(dx) };
  }
  const sa = dy > 0 ? a.y + a.h : a.y, sb = dy > 0 ? b.y : b.y + b.h;
  const xa = Math.max(a.x + 20, Math.min(a.x + a.w - 20, cb.x)), xb = Math.max(b.x + 20, Math.min(b.x + b.w - 20, ca.x));
  return { p: [xa, sa], q: [xb, sb], dir: "v", sy: Math.sign(dy) };
}
for (const [pa, hi, card, et] of R) {
  const A = E[pa], B = E[hi], a = ancla(A, B);
  const [x1, y1] = a.p, [x2, y2] = a.q;
  const d = a.dir === "h"
    ? `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`
    : `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
  ge.appendChild(el("path", { d, fill: "none", stroke: "#64748b", "stroke-width": 1.8 }));
  // cardinalidades
  const off = a.dir === "h" ? [12 * a.sx, -8] : [10, 16 * a.sy];
  const off2 = a.dir === "h" ? [-12 * a.sx, -8] : [10, -16 * a.sy];
  const tag = (x, y, s) => { const g = el("g");
    g.appendChild(el("rect", { x: x - 2 - s.length * 3.2, y: y - 11, width: s.length * 6.4 + 4, height: 15, rx: 4, fill: "#fff", stroke: "#cbd5e1" }));
    g.appendChild(el("text", { x: x, y: y, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: "#334155" }, s)); ge.appendChild(g); };
  tag(x1 + off[0], y1 + off[1] + (a.dir === "h" ? 0 : 0), "1");
  tag(x2 + off2[0], y2 + off2[1], card);
  // etiqueta de la relación
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const w = et.length * 6 + 12;
  ge.appendChild(el("rect", { x: mx - w / 2, y: my - 10, width: w, height: 18, rx: 9, fill: "#fff", stroke: "#cbd5e1" }));
  ge.appendChild(el("text", { x: mx, y: my + 3, "text-anchor": "middle", "font-size": 11, fill: "#475569", "font-style": "italic" }, et));
}

// tablas
const gt = el("g"); svg.appendChild(gt);
const KEYCOL = { "PK": "#b45309", "FK": "#2563eb", "PK/FK": "#b45309", "UK": "#be123c" };
for (const [nom, e] of Object.entries(E)) {
  const G = GRUPOS[e.g], g = el("g");
  g.appendChild(el("rect", { x: e.x + 3, y: e.y + 4, width: e.w, height: e.h, rx: 10, fill: "#0f172a", opacity: .12 }));
  g.appendChild(el("rect", { x: e.x, y: e.y, width: e.w, height: e.h, rx: 10, fill: "#ffffff", stroke: G.base, "stroke-width": 2 }));
  g.appendChild(el("path", { d: `M${e.x},${e.y + HEAD} V${e.y + 10} a10,10 0 0 1 10,-10 H${e.x + e.w - 10} a10,10 0 0 1 10,10 V${e.y + HEAD} Z`, fill: G.base }));
  g.appendChild(el("text", { x: e.x + 12, y: e.y + 20, "font-size": 13.5, "font-weight": 700, fill: "#fff" }, nom));
  e.c.forEach(([n, t, k], i) => {
    const y = e.y + HEAD + i * ROW;
    if (i % 2) g.appendChild(el("rect", { x: e.x + 1, y, width: e.w - 2, height: ROW, fill: G.fondo, opacity: .75 }));
    if (k) g.appendChild(el("rect", { x: e.x + 8, y: y + 4, width: k === "PK/FK" ? 34 : 24, height: 14, rx: 4, fill: KEYCOL[k], opacity: .13 }));
    if (k) g.appendChild(el("text", { x: e.x + (k === "PK/FK" ? 25 : 20), y: y + 15, "text-anchor": "middle", "font-size": 9.5, "font-weight": 800, fill: KEYCOL[k] }, k));
    g.appendChild(el("text", { x: e.x + 48, y: y + 15, "font-size": 12, "font-weight": k.includes("PK") ? 700 : 400, fill: "#0f172a" }, n));
    g.appendChild(el("text", { x: e.x + e.w - 10, y: y + 15, "text-anchor": "end", "font-size": 10.5, fill: "#64748b" }, t));
  });
  gt.appendChild(g);
}
svg.style.width = "100%"; svg.style.height = "auto"; svg.style.maxWidth = maxX + "px";
document.getElementById("lienzo").appendChild(svg);

// exportar PNG
document.getElementById("png").onclick = () => {
  const s = new XMLSerializer().serializeToString(svg), img = new Image();
  img.onload = () => {
    const k = 2, c = document.createElement("canvas"); c.width = maxX * k; c.height = maxY * k;
    const x = c.getContext("2d"); x.scale(k, k); x.drawImage(img, 0, 0);
    const a = document.createElement("a"); a.download = "bienestar_en_casa_modelo_logico.png"; a.href = c.toDataURL("image/png"); a.click();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
};
</script>
</body>
</html>
